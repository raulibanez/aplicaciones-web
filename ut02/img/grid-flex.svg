<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Plus Jakarta Sans, system-ui, sans-serif">
  <!-- Grid reparte la página; flex ordena dentro de cada zona. Elaboración propia. -->
  <rect x="20" y="20" width="860" height="580" rx="18" fill="#FEFEFE"/>
  <text x="40" y="60" font-size="26" font-weight="800" fill="#041C3F">body · display: grid · grid-template-areas</text>
  <!-- rejilla -->
  <rect x="40" y="80" width="820" height="90" rx="10" fill="#041C3F"/>
  <text x="450" y="135" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">header</text>
  <rect x="40" y="180" width="820" height="60" rx="10" fill="#A5E070"/>
  <text x="80" y="219" font-size="24" font-weight="700" fill="#041C3F">nav · display: flex →</text>
  <rect x="330" y="192" width="100" height="36" rx="8" fill="#041C3F"/><text x="380" y="217" font-size="20" fill="#FFFFFF" text-anchor="middle">Qué es</text>
  <rect x="445" y="192" width="140" height="36" rx="8" fill="#041C3F"/><text x="515" y="217" font-size="20" fill="#FFFFFF" text-anchor="middle">Personajes</text>
  <rect x="600" y="192" width="90" height="36" rx="8" fill="#041C3F"/><text x="645" y="217" font-size="20" fill="#FFFFFF" text-anchor="middle">Ficha</text>
  <rect x="705" y="192" width="110" height="36" rx="8" fill="#041C3F"/><text x="760" y="217" font-size="20" fill="#FFFFFF" text-anchor="middle">Opinión</text>
  <rect x="40" y="250" width="540" height="250" rx="10" fill="#FFFFFF" stroke="#017CE9" stroke-width="4"/>
  <text x="310" y="300" font-size="28" font-weight="800" fill="#041C3F" text-anchor="middle">main · 2fr</text>
  <text x="310" y="340" font-size="22" fill="#4A5A7D" text-anchor="middle">texto, listas, tabla, formulario</text>
  <text x="70" y="420" font-size="22" font-weight="700" fill="#017CE9">.notas · display: flex →</text>
  <g fill="#E3ECF3" stroke="#017CE9" stroke-width="2">
    <rect x="70" y="440" width="40" height="36" rx="6"/><rect x="118" y="440" width="40" height="36" rx="6"/><rect x="166" y="440" width="40" height="36" rx="6"/><rect x="214" y="440" width="40" height="36" rx="6"/><rect x="262" y="440" width="40" height="36" rx="6"/>
  </g>
  <rect x="600" y="250" width="260" height="250" rx="10" fill="#E3ECF3"/>
  <text x="730" y="300" font-size="28" font-weight="800" fill="#041C3F" text-anchor="middle">aside · 1fr</text>
  <text x="730" y="340" font-size="22" fill="#4A5A7D" text-anchor="middle">.galeria · display: grid</text>
  <g fill="#A5E070">
    <rect x="620" y="360" width="220" height="60" rx="6"/><rect x="620" y="430" width="105" height="55" rx="6"/><rect x="735" y="430" width="105" height="55" rx="6"/>
  </g>
  <rect x="40" y="510" width="820" height="70" rx="10" fill="#041C3F"/>
  <text x="450" y="554" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">footer</text>
